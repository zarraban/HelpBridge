spring.application.name=help-bridge

spring.datasource.url=jdbc:postgresql://localhost:5432/help_bridge
spring.datasource.username=admin
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

helpbridge.audit.enabled=true
helpbridge.audit.slow-threshold-ms=10
helpbridge.audit.include.client-ip=true
helpbridge.audit.include.user-agent=true
helpbridge.audit.include.handler-method=true
helpbridge.audit.include.query-params=true
helpbridge.audit.include.headers=true
helpbridge.audit.include.thread-name=true
spring.jackson.deserialization.fail-on-unknown-properties=true