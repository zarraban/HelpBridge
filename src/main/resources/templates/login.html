<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Вхід')}"></head>
<body>
<a th:replace="~{fragments/layout :: skipLink}"></a>
<nav th:replace="~{fragments/layout :: nav('login')}"></nav>
<main id="main-content" tabindex="-1">
    <form id="login-form" class="card narrow" th:action="@{/login}" method="post">
        <header th:replace="~{fragments/layout :: pageHeader('Вхід', 'Оберіть тип облікового запису та введіть дані для входу.', ~{})}"></header>

        <th:block th:if="${param.error}"><p th:replace="~{fragments/layout :: alert('error', 'Не вдалося увійти. Перевірте тип облікового запису, email і пароль.')}"></p></th:block>
        <th:block th:if="${param.disabled}"><p th:replace="~{fragments/layout :: alert('error', 'Обліковий запис неактивний. Зверніться до представника вашого фонду.')}"></p></th:block>
        <th:block th:if="${param.expired}"><p th:replace="~{fragments/layout :: alert('info', 'Сесію завершено. Увійдіть знову, щоб продовжити роботу.')}"></p></th:block>
        <th:block th:if="${param.logout}"><p th:replace="~{fragments/layout :: alert('success', 'Ви вийшли з системи.')}"></p></th:block>

        <input id="username" name="username" type="hidden">
        <div class="field">
            <label for="accountType">Тип облікового запису</label>
            <select id="accountType">
                <option value="APPLICANT">Заявник</option>
                <option value="FUND_REPRESENTATIVE">Представник фонду</option>
                <option value="VOLUNTEER">Волонтер</option>
                <option value="SYSTEM_ADMIN">Адміністратор</option>
            </select>
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username" autofocus required>
        </div>
        <div class="field">
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn">Увійти</button>
    </form>
</main>
<script>
    document.getElementById('login-form').addEventListener('submit', function () {
        document.getElementById('username').value =
            document.getElementById('accountType').value + ':' + document.getElementById('email').value.trim();
    });
</script>
</body>
</html>
