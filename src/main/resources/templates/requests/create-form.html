<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Нова заявка')}"></head>
<body>
<a th:replace="~{fragments/layout :: skipLink}"></a>
<nav th:replace="~{fragments/layout :: nav('new-request')}"></nav>
<main id="main-content" tabindex="-1">
    <header th:replace="~{fragments/layout :: pageHeader('Нова заявка на допомогу', 'Опишіть вашу ситуацію та допомогу, якої потребуєте.', ~{})}"></header>

    <form data-submit-once class="card" th:action="@{/requests}" th:object="${form}" method="post">

        <p class="alert alert-error" role="alert" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>

        <p class="alert alert-error" role="alert" th:if="${#fields.hasErrors('*')}">Не вдалося подати заявку. Перевірте позначені поля; введені дані збережено.</p>
        <th:block th:replace="~{fragments/request-fields :: fields}"></th:block>

        <div class="field checkbox">
            <input id="dataProcessingConsent" aria-describedby="dataProcessingConsent-error" type="checkbox" th:field="*{dataProcessingConsent}" aria-required="true" th:errorclass="field-invalid" th:attr="aria-invalid=${#fields.hasErrors('dataProcessingConsent')}">
            <label for="dataProcessingConsent">Погоджуюсь на перевірку інформації <span class="required-mark" aria-hidden="true">*</span></label>
            <span id="dataProcessingConsent-error" class="field-error" th:if="${#fields.hasErrors('dataProcessingConsent')}" th:errors="*{dataProcessingConsent}"></span>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn">Подати заявку</button>
            <a class="btn btn-secondary" th:href="@{/requests}">Скасувати</a>
        </div>
        <p class="field-hint" data-submit-status role="status" hidden>Надсилаємо заявку…</p>
    </form>
</main>
</body>
</html>
