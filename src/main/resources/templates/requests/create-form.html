<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Нова заявка')}"></head>
<body>
<a th:replace="~{fragments/layout :: skipLink}"></a>
<nav th:replace="~{fragments/layout :: nav('new-request')}"></nav>
<main id="main-content" tabindex="-1">
    <header th:replace="~{fragments/layout :: pageHeader('Нова заявка на допомогу', 'Опишіть вашу ситуацію та допомогу, якої потребуєте.', ~{})}"></header>

    <form class="card" th:action="@{/requests}" th:object="${form}" method="post">

        <p class="alert alert-error" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>

        <p class="field-hint">Поля, позначені *, обов’язкові для заповнення.</p>

        <div class="field">
            <label for="assistanceType">Тип допомоги <span class="required-mark" aria-hidden="true">*</span></label>
            <select id="assistanceType" th:field="*{assistanceType}" aria-required="true" th:errorclass="field-invalid" th:attr="aria-invalid=${#fields.hasErrors('assistanceType')}">
                <option value="">-- оберіть --</option>
                <option th:each="t : ${assistanceTypes}" th:value="${t.key}" th:text="${t.value}"></option>
            </select>
            <span class="field-error" th:if="${#fields.hasErrors('assistanceType')}" th:errors="*{assistanceType}"></span>
        </div>

        <div class="field" id="otherTypeField" style="display:none">
            <label for="otherAssistanceType">Опишіть, який саме тип допомоги</label>
            <input id="otherAssistanceType" type="text" th:field="*{otherAssistanceType}" th:errorclass="field-invalid" th:attr="aria-invalid=${#fields.hasErrors('otherAssistanceType')}">
            <span class="field-error" th:if="${#fields.hasErrors('otherAssistanceType')}" th:errors="*{otherAssistanceType}"></span>
        </div>

        <div class="field">
            <label for="amount">Потрібна сума, грн <span class="required-mark" aria-hidden="true">*</span></label>
            <input id="amount" type="number" step="0.01" th:field="*{amount}" aria-required="true" th:errorclass="field-invalid" th:attr="aria-invalid=${#fields.hasErrors('amount')}">
            <span class="field-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></span>
        </div>

        <div class="field">
            <label for="deadline">Крайній термін <span class="required-mark" aria-hidden="true">*</span></label>
            <input id="deadline" type="date" th:field="*{deadline}" aria-required="true" th:errorclass="field-invalid" th:attr="aria-invalid=${#fields.hasErrors('deadline')}">
            <span class="field-error" th:if="${#fields.hasErrors('deadline')}" th:errors="*{deadline}"></span>
        </div>

        <div class="field">
            <label for="situationDescription">Опис ситуації <span class="required-mark" aria-hidden="true">*</span></label>
            <textarea id="situationDescription" rows="4" th:field="*{situationDescription}" aria-required="true" th:errorclass="field-invalid" th:attr="aria-invalid=${#fields.hasErrors('situationDescription')}"></textarea>
            <span class="field-error" th:if="${#fields.hasErrors('situationDescription')}" th:errors="*{situationDescription}"></span>
        </div>

        <div class="field">
            <label for="needDescription">Яка саме допомога потрібна <span class="required-mark" aria-hidden="true">*</span></label>
            <textarea id="needDescription" rows="3" th:field="*{needDescription}" aria-required="true" th:errorclass="field-invalid" th:attr="aria-invalid=${#fields.hasErrors('needDescription')}"></textarea>
            <span class="field-error" th:if="${#fields.hasErrors('needDescription')}" th:errors="*{needDescription}"></span>
        </div>

        <div class="field">
            <label for="institutionName">Установа, яка може підтвердити обставини <span class="required-mark" aria-hidden="true">*</span></label>
            <input id="institutionName" type="text" th:field="*{institutionName}" aria-required="true" th:errorclass="field-invalid" th:attr="aria-invalid=${#fields.hasErrors('institutionName')}">
            <span class="field-error" th:if="${#fields.hasErrors('institutionName')}" th:errors="*{institutionName}"></span>
        </div>

        <div class="field">
            <label for="applicationNumber">Номер заяви/звернення/документа <span class="required-mark" aria-hidden="true">*</span></label>
            <input id="applicationNumber" type="text" th:field="*{applicationNumber}" aria-required="true" th:errorclass="field-invalid" th:attr="aria-invalid=${#fields.hasErrors('applicationNumber')}">
            <span class="field-error" th:if="${#fields.hasErrors('applicationNumber')}" th:errors="*{applicationNumber}"></span>
        </div>

        <div class="field checkbox">
            <input id="dataProcessingConsent" type="checkbox" th:field="*{dataProcessingConsent}" aria-required="true" th:errorclass="field-invalid" th:attr="aria-invalid=${#fields.hasErrors('dataProcessingConsent')}">
            <label for="dataProcessingConsent">Погоджуюсь на перевірку інформації <span class="required-mark" aria-hidden="true">*</span></label>
            <span class="field-error" th:if="${#fields.hasErrors('dataProcessingConsent')}" th:errors="*{dataProcessingConsent}"></span>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn">Подати заявку</button>
            <a class="btn btn-secondary" th:href="@{/requests}">Скасувати</a>
        </div>
    </form>
</main>
<script>
    (function () {
        const select = document.getElementById('assistanceType');
        const box = document.getElementById('otherTypeField');
        function toggle() {
            box.style.display = select.options[select.selectedIndex].text.trim() === 'Інше' ? 'block' : 'none';
        }
        select.addEventListener('change', toggle);
        toggle();
    })();
</script>
</body>
</html>
