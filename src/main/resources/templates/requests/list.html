<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Заявки на допомогу</title>
</head>
<body>
<h1>Заявки на допомогу</h1>

<p th:if="${message}" th:text="${message}"></p>

<p><a th:href="@{/requests/new}">Подати нову заявку</a></p>

<p th:if="${#lists.isEmpty(requests)}">Нових заявок поки немає.</p>

<table th:unless="${#lists.isEmpty(requests)}">
    <thead>
    <tr>
        <th>Тип допомоги</th>
        <th>Яка допомога</th>
        <th>Сума, грн</th>
        <th>Установа</th>
        <th>Крайній термін</th>
        <th>Статус</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${requests}">
        <td th:text="${assistanceTypes[#strings.toString(r.assistanceType)] ?: r.assistanceType}"></td>
        <td th:text="${r.needDescription}"></td>
        <td th:text="${r.amount}"></td>
        <td th:text="${r.institutionName}"></td>
        <td th:text="${#temporals.format(r.deadline, 'dd.MM.yyyy')}"></td>
        <td>
            <span th:if="${r.hot}">Гаряча</span>
            <span th:unless="${r.hot}" th:text="${r.status}"></span>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
