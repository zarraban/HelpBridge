<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Бронювання заявки')}"></head>
<body>
<a th:replace="~{fragments/layout :: skipLink}"></a>
<nav th:replace="~{fragments/layout :: nav('requests')}"></nav>
<main id="main-content" tabindex="-1">
    <header th:replace="~{fragments/layout :: pageHeader(${'Взяти заявку №' + request.id + ' в роботу?'}, 'Підтвердьте бронювання від імені вашого фонду.', ~{})}"></header>
    <section class="card details-section" aria-labelledby="booking-summary-heading">
        <h2 id="booking-summary-heading">Підтвердження бронювання</h2>
        <dl class="details-grid">
            <div><dt>Ваш фонд</dt><dd th:text="${fundName}"></dd></div>
            <div><dt>Установа</dt><dd th:text="${request.institutionName}"></dd></div>
            <div><dt>Потрібна сума</dt><dd><span th:text="${#numbers.formatDecimal(request.amount, 1, 'WHITESPACE', 2, 'COMMA')}"></span> грн</dd></div>
        </dl>
        <h3>Яка саме допомога потрібна</h3>
        <p class="details-text" th:text="${request.needDescription}"></p>
        <p id="booking-warning" class="alert alert-warning">Заявка перейде у статус «У роботі» та буде закріплена за вашим фондом. Інші фонди більше не зможуть її забронювати.</p>
        <form data-submit-once th:action="@{/requests/{id}/book(id=${request.id})}" method="post" aria-describedby="booking-warning">
            <div class="form-actions">
                <a class="btn btn-secondary" th:href="@{/requests/{id}(id=${request.id})}">Скасувати</a>
                <button type="submit" class="btn">Так, взяти в роботу</button>
            </div>
            <p class="field-hint" data-submit-status role="status" hidden>Бронюємо заявку…</p>
        </form>
    </section>
</main>
</body>
</html>
