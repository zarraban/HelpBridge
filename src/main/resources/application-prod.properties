#-- Server & Port
server.port=${PORT:8080}

#-- Reverse Proxy & Forwarded Headers (Nginx SSL Termination)
# Resolves client IP (X-Forwarded-For) and ensures redirects use https:// (X-Forwarded-Proto)
server.forward-headers-strategy=native

#-- Session & Cookie Security
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

#-- PostgreSQL Datasource (Configured via environment variables from .env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-db:5432/help_bridge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#-- JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

#-- JWT Security (Mandatory secret provided via environment variable)
security.jwt.secret=${JWT_SECRET}

#-- Spring Boot Actuator (Expose only health endpoint for Docker healthcheck)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

#-- Swagger / OpenAPI (Disabled in production for security)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

#-- Error Handling (Hide stack traces and sensitive error messages)
server.error.include-stacktrace=never
server.error.include-message=never

#-- Audit Logging Starter
helpbridge.audit.enabled=true
helpbridge.audit.slow-threshold-ms=50
