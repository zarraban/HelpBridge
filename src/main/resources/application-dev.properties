
#-- H2 DB properties
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#-- JPA Properties
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


#-- Audit Logger Starter Properties
helpbridge.audit.enabled=true
helpbridge.audit.slow-threshold-ms=10
helpbridge.audit.include.client-ip=true
helpbridge.audit.include.user-agent=true
helpbridge.audit.include.handler-method=true
helpbridge.audit.include.query-params=true
helpbridge.audit.include.headers=true
helpbridge.audit.include.thread-name=true



#-- Schema is generated by Hibernate in dev; Flyway is used in prod only
spring.flyway.enabled=false
